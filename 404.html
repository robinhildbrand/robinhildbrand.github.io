<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect handler
    // Converts paths like /posts/slug to /#/post/slug
    (function() {
      var path = window.location.pathname;
      var repo = '/robinhildbrand.github.io';
      
      // Strip repo prefix if present
      if (path.startsWith(repo)) {
        path = path.substring(repo.length);
      }
      
      var cleanPath = path.replace(/^\/+/, '').replace(/\/+$/, '');
      var targetHash = '#/';
      
      if (cleanPath.startsWith('post/') || cleanPath.startsWith('posts/')) {
        var slug = cleanPath.split('/')[1] || '';
        targetHash = '#/post/' + slug;
      } else if (cleanPath === 'graph' || cleanPath === 'posts' || cleanPath === 'tags' || cleanPath === 'about') {
        targetHash = '#/' + cleanPath;
      } else if (cleanPath.startsWith('tag/')) {
        targetHash = '#/' + cleanPath;
      }
      
      window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/') + '/' + targetHash);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="./">Home</a>...</p>
</body>
</html>
