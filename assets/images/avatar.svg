<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bg-grad)"/>
  
  <!-- Graph network halo -->
  <g opacity="0.45">
    <line x1="30" y1="35" x2="60" y2="20" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="60" y1="20" x2="90" y2="35" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="25" y1="65" x2="30" y2="35" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="95" y1="65" x2="90" y2="35" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="30" y1="85" x2="25" y2="65" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="90" y1="85" x2="95" y2="65" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="3" fill="#6366f1"/>
    <circle cx="60" cy="20" r="3.5" fill="#38bdf8"/>
    <circle cx="90" cy="35" r="3" fill="#a855f7"/>
    <circle cx="25" cy="65" r="3" fill="#38bdf8"/>
    <circle cx="95" cy="65" r="3" fill="#ec4899"/>
    <circle cx="30" cy="85" r="2.5" fill="#818cf8"/>
    <circle cx="90" cy="85" r="2.5" fill="#818cf8"/>
  </g>

  <!-- Person Silhouette -->
  <circle cx="60" cy="48" r="20" fill="url(#avatar-grad)"/>
  <path d="M28 102 C28 78, 42 74, 60 74 C78 74, 92 78, 92 102 Z" fill="url(#avatar-grad)" opacity="0.9"/>
  <circle cx="60" cy="48" r="16" fill="#ffffff" opacity="0.15"/>
</svg>