<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Network Graph Pattern Overlay -->
  <!-- Edges -->
  <line x1="60" y1="70" x2="100" y2="45" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="100" y1="45" x2="140" y2="70" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="60" y1="70" x2="100" y2="110" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="140" y1="70" x2="100" y2="110" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="60" y1="70" x2="50" y2="135" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="100" y1="110" x2="100" y2="155" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="140" y1="70" x2="150" y2="135" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="50" y1="135" x2="100" y2="155" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
  <line x1="150" y1="135" x2="100" y2="155" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />

  <!-- Nodes -->
  <circle cx="100" cy="45" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="60" cy="70" r="7" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="140" cy="70" r="7" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="100" cy="110" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="135" r="7" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="150" cy="135" r="7" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="100" cy="155" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Academic Lettering RH -->
  <text x="100" y="115" font-family="'EB Garamond', serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">RH</text>
</svg>
