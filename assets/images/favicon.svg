<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <!-- Links -->
  <line x1="18" y1="22" x2="34" y2="16" stroke="#475569" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="18" y1="22" x2="24" y2="46" stroke="#6366f1" stroke-width="2.5" opacity="0.8"/>
  <line x1="34" y1="16" x2="48" y2="26" stroke="#a855f7" stroke-width="2.5" opacity="0.8"/>
  <line x1="24" y1="46" x2="44" y2="48" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <line x1="48" y1="26" x2="44" y2="48" stroke="#818cf8" stroke-width="2.5" opacity="0.8"/>
  <line x1="18" y1="22" x2="48" y2="26" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <line x1="34" y1="16" x2="44" y2="48" stroke="#c084fc" stroke-width="2" opacity="0.4"/>
  
  <!-- Nodes -->
  <circle cx="18" cy="22" r="6" fill="url(#grad2)" filter="url(#glow)"/>
  <circle cx="34" cy="16" r="7" fill="url(#grad1)" filter="url(#glow)"/>
  <circle cx="48" cy="26" r="5.5" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="24" cy="46" r="6.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="44" cy="48" r="7.5" fill="url(#grad1)" filter="url(#glow)"/>
</svg>