# Academic Blog Configuration
title: "Robin Hildbrand"
tagline: "Network Science • Mathematical Modeling • Machine Learning"
description: "Academic research notes and blog on spectral graph theory, dynamical systems, network science, and computational mathematics."
url: "https://robinhildbrand.github.io"
baseurl: ""

# Author Information
author:
  name: "Robin Hildbrand"
  avatar: "/assets/images/avatar.svg"
  title: "Researcher in Computational Science & Applied Mathematics"
  institution: "École Polytechnique Fédérale de Lausanne (EPFL)"
  location: "Lausanne, Switzerland"
  email: "robin.hildbrand@epfl.ch"
  github: "robinhildbrand"
  scholar: "#"
  orcid: "#"
  linkedin: "robinhildbrand"
  bio: "Investigating the mathematics of complex networks, graph neural networks, spectral graph theory, and dynamic processes on graphs at EPFL."

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null # KaTeX is rendered client-side for highest speed & formula rendering accuracy

permalink: /posts/:year-:month-:day-:title/

# Navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Articles"
    url: "/blog/"
  - title: "Plotting Guide"
    url: "/graph-guide/"
  - title: "About & CV"
    url: "/about/"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
