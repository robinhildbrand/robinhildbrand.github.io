<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social graphs & interactions</title>
  <meta name="description" content="Individual group site with weekly articles">
  <meta name="author" content="Group">

  <!-- OpenGraph / Social Meta -->
  <meta property="og:title" content="Social graphs & interactions">
  <meta property="og:description" content="Individual group site with weekly articles">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/favicon.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX CSS for LaTeX Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">

  <!-- Highlight.js CSS for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

  <!-- Site Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/graph.css?v=20260904-26">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="site-brand">
        <div class="brand-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="6" r="3"/>
            <circle cx="18" cy="6" r="3"/>
            <circle cx="18" cy="18" r="3"/>
            <circle cx="6" cy="18" r="3"/>
            <line x1="8.5" y1="7.5" x2="15.5" y2="16.5"/>
            <line x1="8.5" y1="16.5" x2="15.5" y2="7.5"/>
            <line x1="6" y1="9" x2="6" y2="15"/>
            <line x1="18" y1="9" x2="18" y2="15"/>
          </svg>
        </div>
        <div class="brand-title">
          <span class="brand-name">Individual Group site</span>
          <span class="brand-subtitle">Social graphs & interactions</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="nav-desktop">
        <a href="#/" class="nav-link active">Home</a>
        <a href="#/posts" class="nav-link">Articles</a>
        <a href="#/graph" class="nav-link">Knowledge Graph 🕸️</a>
        <a href="#/about" class="nav-link">About</a>
      </nav>

      <!-- Nav Actions (Search & Theme) -->
      <div class="nav-actions">
        <button class="search-trigger-btn" id="search-trigger-btn" title="Search articles and concepts (Cmd+K)">
          <span>🔍 Search</span>
          <kbd class="kbd-shortcut">⌘K</kbd>
        </button>

        <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle theme">
          ☀️
        </button>

        <button class="mobile-menu-btn" id="mobile-menu-btn" title="Toggle navigation menu">
          ☰
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Dropdown -->
  <nav id="mobile-nav" style="display: none; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 1rem 1.5rem; flex-direction: column; gap: 0.75rem;">
    <a href="#/" class="nav-link">Home</a>
    <a href="#/posts" class="nav-link">Articles</a>
    <a href="#/graph" class="nav-link">Knowledge Graph 🕸️</a>
    <a href="#/about" class="nav-link">About</a>
  </nav>

  <!-- Main Single Page Content Root -->
  <main id="app">
    <!-- Dynamic view content injected by app.js -->
    <div class="container" style="padding: 4rem 1rem; text-align: center;">
      <p style="color: var(--text-muted);">Loading graph blog...</p>
    </div>
  </main>

  <!-- Global Command Palette / Search Modal -->
  <div class="search-modal-backdrop" id="search-modal">
    <div class="search-modal-card">
      <div class="search-input-wrapper">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-modal-input" id="search-input" placeholder="Search articles, wikilinks, concepts, or topics..." autocomplete="off">
      </div>
      <div class="search-results-list" id="search-results">
        <!-- Injected dynamically -->
      </div>
      <div class="search-modal-footer">
        <span>Use <kbd class="kbd-shortcut">↑</kbd> <kbd class="kbd-shortcut">↓</kbd> to navigate</span>
        <span>Press <kbd class="kbd-shortcut">ESC</kbd> to close</span>
      </div>
    </div>
  </div>

  <!-- External CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>

  <!-- Core Blog & Graph Engines -->
  <script src="assets/js/graph-engine.js?v=20260904-26"></script>
  <script src="assets/js/graph-parser.js?v=20260904-26"></script>
  <script src="assets/js/markdown.js?v=20260904-26"></script>
  <script src="assets/js/posts-store.js?v=20260904-26"></script>
  <script src="assets/js/app.js?v=20260904-26"></script>
</body>
</html>
